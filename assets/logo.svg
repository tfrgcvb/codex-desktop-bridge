  <path d="M81 63L86 68L81 73" stroke="#34D399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="88" y1="73" x2="94" y2="73" stroke="#34D399" stroke-width="2.4" stroke-linecap="round"/>
