  <!-- 10% safe margin: 14..114 (100x100 rounded card) -->
  <rect x="14" y="14" width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="2"/>
