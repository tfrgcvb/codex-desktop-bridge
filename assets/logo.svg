  <path d="M72 54L76 60L69 60" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M74 76C65 87 55 87 46 76" stroke="url(#bridgeArc)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
