<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Codex Desktop Bridge Card</title>
  <style>
    :root,
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: var(--color-background-secondary, #16171a);
      --surface: var(--color-background-tertiary, #1f2024);
      --border: var(--color-border-primary, rgba(255, 255, 255, 0.1));
      --text: var(--color-text-primary, #e6e7ea);
      --secondary: var(--color-text-secondary, #b5b8c0);
      --muted: var(--color-text-tertiary, #8a8e98);
      --primary: #a8c7fa;
      --emerald: #7ce0bc;
      --amber: #fdba74;
      --rose: #f28b82;
      --cmd-bg: #0f1013;
      --font-sans: var(--font-sans, "Google Sans", "Product Sans", system-ui, -apple-system, sans-serif);
      --font-mono: var(--font-mono, "Cascadia Code", "JetBrains Mono", Consolas, monospace);
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg: var(--color-background-secondary, #f4f6f9);
      --surface: var(--color-background-primary, #ffffff);
      --border: var(--color-border-primary, rgba(15, 23, 42, 0.12));
      --text: var(--color-text-primary, #1f1f1f);
      --secondary: var(--color-text-secondary, #444746);
      --muted: var(--color-text-tertiary, #747775);
      --primary: #0b57d0;
      --emerald: #146c2e;
      --amber: #b06000;
      --rose: #b3261e;
      --cmd-bg: #eef1f5;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--text);
      overflow-x: hidden;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.25);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.42);
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--bg);
      overflow: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 13px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-weight: 500;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      background: rgba(138, 180, 248, 0.18);
      color: var(--primary);
      white-space: nowrap;
    }
    .badge.completed { background: rgba(80, 180, 140, 0.2); color: var(--emerald); }
    .badge.interrupted, .badge.pending { background: rgba(251, 146, 60, 0.2); color: var(--amber); }
    .badge.failed { background: rgba(242, 139, 130, 0.2); color: var(--rose); }
    .body {
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .meta {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      word-break: break-all;
    }
    .thinking {
      padding-left: 11px;
      border-left: 2px solid var(--border);
      color: var(--secondary);
      font-size: 12.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .prose {
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .cmd {
      font-family: var(--font-mono);
      font-size: 11px;
      background: var(--cmd-bg);
      color: var(--secondary);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      word-break: break-all;
    }
    button {
      border: none;
      background: rgba(168, 199, 250, 0.14);
      color: var(--primary);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: rgba(168, 199, 250, 0.24); }
  </style>
</head>
<body>
  <div class="card" id="card-root">
    <div class="header">
      <div class="title-group">
        <svg viewBox="0 0 28 28" width="17" height="17" fill="none">
          <path d="M14 1.5C14 8.40356 19.5964 14 26.5 14C19.5964 14 14 19.5964 14 26.5C14 19.5964 8.40356 14 1.5 14C8.40356 14 14 8.40356 14 1.5Z" fill="#a8c7fa"/>
        </svg>
        <span>Codex Desktop Bridge</span>
        <span class="badge" id="status-badge">等待结果</span>
      </div>
      <button type="button" id="refresh-btn">↻ 刷新状态</button>
    </div>
    <div class="body" id="card-body">
      <div class="meta">正在同步 Codex 会话数据...</div>
    </div>
  </div>

  <script>
    (function () {
      let rpcSeq = 0;
      const pending = new Map();
      let currentData = {};
      let lastReportedHeight = 0;

      function rpcRequest(method, params) {
        const id = ++rpcSeq;
        window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
        return new Promise((resolve, reject) => {
          pending.set(id, { resolve, reject });
          setTimeout(() => {
            if (pending.has(id)) {
              pending.delete(id);
              reject(new Error('RPC timeout'));
            }
          }, 15000);
        });
      }

      function applyHostContext(ctx) {
        if (!ctx || typeof ctx !== 'object') return;
        if (ctx.theme === 'light' || ctx.theme === 'dark') {
          document.documentElement.dataset.theme = ctx.theme;
          document.documentElement.style.colorScheme = ctx.theme;
        }
        const vars = ctx.styles && ctx.styles.variables;
        if (vars && typeof vars === 'object') {
          for (const [k, v] of Object.entries(vars)) {
            if (typeof k === 'string' && k.startsWith('--') && typeof v === 'string') {
              document.documentElement.style.setProperty(k, v);
            }
          }
        }
      }

      function reportSize() {
        const card = document.getElementById('card-root');
        if (!card) return;
        const rect = card.getBoundingClientRect();
        const height = Math.min(800, Math.max(88, Math.ceil(rect.height + 2)));
        if (height === lastReportedHeight) return;
        lastReportedHeight = height;
        window.parent.postMessage({
          jsonrpc: '2.0',
          method: 'ui/notifications/size-changed',
          params: {
            width: Math.ceil(rect.width || document.documentElement.scrollWidth || 600),
            height,
          },
        }, '*');
      }

      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function render(data) {
        currentData = Object.assign({}, currentData, data || {});
        const badge = document.getElementById('status-badge');
        const body = document.getElementById('card-body');
        const status = currentData.status || currentData.statusType || 'submitted';
        badge.textContent = status;
        badge.className = 'badge ' + (
          status === 'completed' ? 'completed' :
          status === 'interrupted' || status === 'pending' ? 'interrupted' :
          status === 'failed' ? 'failed' : ''
        );

        const parts = [];
        if (currentData.threadId) {
          parts.push(`<div class="meta">Thread ${escapeHtml(currentData.threadId)}${currentData.jobId ? ' · Job ' + escapeHtml(currentData.jobId.slice(0, 8)) : ''}${currentData.via ? ' · ' + escapeHtml(currentData.via) : ''}</div>`);
        }
        if (currentData.notice) {
          parts.push(`<div class="meta" style="color:var(--amber);">${escapeHtml(currentData.notice)}</div>`);
        }
        if (Array.isArray(currentData.commentary) && currentData.commentary.length) {
          parts.push(`<div class="thinking">${escapeHtml(currentData.commentary.join('\n'))}</div>`);
        }
        if (Array.isArray(currentData.commands) && currentData.commands.length) {
          for (const c of currentData.commands) {
            parts.push(`<div class="cmd">$ ${escapeHtml(c.command || '')} (${escapeHtml(c.exitCode ?? c.status ?? '')})</div>`);
          }
        }
        if (currentData.reply) {
          parts.push(`<div class="prose">${escapeHtml(currentData.reply)}</div>`);
        } else if (Array.isArray(currentData.turns) && currentData.turns.length) {
          const last = currentData.turns[currentData.turns.length - 1];
          if (last && last.reply) {
            parts.push(`<div class="prose">${escapeHtml(last.reply)}</div>`);
          }
        }
        if (currentData.error) {
          parts.push(`<div class="prose" style="color:var(--rose);">错误: ${escapeHtml(currentData.error)}</div>`);
        }
        body.innerHTML = parts.join('') || '<div class="meta">已提交任务，可点击右上角刷新查看最新进度。</div>';
        requestAnimationFrame(reportSize);
      }

      window.addEventListener('message', (event) => {
        const msg = event && event.data;
        if (!msg || typeof msg !== 'object') return;
        if (msg.id && pending.has(msg.id) && !msg.method) {
          const p = pending.get(msg.id);
          pending.delete(msg.id);
          if (msg.error) p.reject(new Error(msg.error.message || 'RPC error'));
          else p.resolve(msg.result);
          return;
        }
        if (msg.method === 'ui/notifications/tool-input') {
          render(msg.params && msg.params.arguments);
        } else if (msg.method === 'ui/notifications/tool-result') {
          const sc = msg.params && msg.params.structuredContent;
          if (sc) render(sc);
        } else if (msg.method === 'ui/notifications/host-context-changed') {
          applyHostContext(msg.params);
        }
      });

      document.getElementById('refresh-btn').addEventListener('click', async () => {
        if (!currentData.threadId) return;
        try {
          const res = currentData.jobId
            ? await rpcRequest('tools/call', {
                name: 'codex_status',
                arguments: { threadId: currentData.threadId, jobId: currentData.jobId },
              })
            : await rpcRequest('tools/call', {
                name: 'codex_thread_detail',
                arguments: { threadId: currentData.threadId, limit: 5 },
              });
          if (res && res.structuredContent) render(res.structuredContent);
        } catch (err) {
          render({ error: err.message });
        }
      });

      if (typeof ResizeObserver !== 'undefined') {
        const ro = new ResizeObserver(() => reportSize());
        ro.observe(document.getElementById('card-root'));
      }

      rpcRequest('ui/initialize', {
        protocolVersion: '2025-11-25',
        appInfo: { name: 'codex-desktop-bridge-card', version: '0.3.0' },
        appCapabilities: {},
      }).then((res) => {
        if (res && res.hostContext) applyHostContext(res.hostContext);
        window.parent.postMessage({ jsonrpc: '2.0', method: 'ui/notifications/initialized', params: {} }, '*');
        requestAnimationFrame(reportSize);
      }).catch(() => {});
    })();
  </script>
</body>
</html>
